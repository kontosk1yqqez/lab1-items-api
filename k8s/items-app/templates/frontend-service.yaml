apiVersion: v1
kind: Service
metadata:
  name: {{ include "items-app.frontend.fullname" . }}
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "items-app.selector" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
