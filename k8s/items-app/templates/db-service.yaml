apiVersion: v1
kind: Service
metadata:
  name: {{ include "items-app.db.fullname" . }}
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  clusterIP: None   # headless service для StatefulSet
  selector:
    {{- include "items-app.selector" (dict "ctx" $ "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.db.port }}
      targetPort: postgres
