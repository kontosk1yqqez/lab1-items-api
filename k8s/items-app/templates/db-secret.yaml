{{- if not .Values.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "items-app.db.secretName" . }}
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.db.database | quote }}
  POSTGRES_USER: {{ .Values.db.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  # ConnectionString для API та міграцій (своя для кожного середовища/релізу)
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:%v/%s" .Values.db.username .Values.db.password (include "items-app.db.fullname" .) .Values.db.port .Values.db.database | quote }}
{{- end }}
