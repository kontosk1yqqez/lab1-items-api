apiVersion: v1
kind: Pod
metadata:
  name: {{ include "items-app.fullname" . }}-test-api
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS http://{{ include "items-app.api.fullname" . }}:{{ .Values.api.service.port }}/healthz &&
          curl -fsS http://{{ include "items-app.api.fullname" . }}:{{ .Values.api.service.port }}/api/items &&
          curl -fsS -o /dev/null http://{{ include "items-app.frontend.fullname" . }}:{{ .Values.frontend.service.port }}/ &&
          echo " all checks passed"
