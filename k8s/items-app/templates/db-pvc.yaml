apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "items-app.db.fullname" . }}-pvc
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  accessModes: [{{ .Values.db.persistence.accessMode }}]
  {{- with (include "items-app.storageClassName" .) }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.db.persistence.size }}
