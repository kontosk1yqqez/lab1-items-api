apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "items-app.frontend.fullname" . }}
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "items-app.selector" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "items-app.selector" (dict "ctx" $ "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "items-app.image" (dict "ctx" $ "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | quote }}
            - name: API_UPSTREAM
              value: {{ printf "http://%s:%v" (include "items-app.api.fullname" .) .Values.api.service.port | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
