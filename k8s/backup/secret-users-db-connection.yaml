# Secret з параметрами підключення до PostgreSQL (ДЕМОНСТРАЦІЙНІ значення для стенда kind).
# PGHOST — DNS-ім'я headless Service PostgreSQL з ЛР4 (реліз lab у namespace webapp-lab),
# доступне з будь-якого Pod кластера. Для реального середовища створюйте Secret командою
#   kubectl -n demo create secret generic users-db-connection \
#     --from-literal=PGHOST=<host> --from-literal=PGPORT=5432 --from-literal=PGDATABASE=<db> \
#     --from-literal=PGUSER=<user> --from-literal=PGPASSWORD=<password>
# і не зберігайте справжній пароль у репозиторії.
apiVersion: v1
kind: Secret
metadata:
  name: users-db-connection
  namespace: demo
type: Opaque
stringData:
  PGHOST: lab-items-app-db.webapp-lab.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: items
  PGUSER: items
  PGPASSWORD: lab-password
