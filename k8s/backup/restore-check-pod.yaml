# Допоміжний Pod з PostgreSQL-клієнтом: монтує PVC з архівами для pg_restore --list і відновлення
apiVersion: v1
kind: Pod
metadata:
  name: backup-inspector
  namespace: demo
spec:
  restartPolicy: Never
  containers:
    - name: pg
      image: postgres:16-alpine
      command: ["sleep", "3600"]
      envFrom:
        - secretRef:
            name: users-db-connection
      volumeMounts:
        - name: backups
          mountPath: /backups
  volumes:
    - name: backups
      persistentVolumeClaim:
        claimName: postgres-backups
