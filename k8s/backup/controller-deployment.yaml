apiVersion: apps/v1
kind: Deployment
metadata:
  name: databasebackup-controller
  namespace: demo
  labels:
    app.kubernetes.io/name: databasebackup-controller
spec:
  replicas: 1            # один екземпляр: звірка виконується послідовно, без конкуренції
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: databasebackup-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databasebackup-controller
    spec:
      serviceAccountName: databasebackup-controller
      containers:
        - name: controller
          image: docker.io/kontorsk1yqqez/databasebackup-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: demo
            - name: RESYNC_SECONDS
              value: "60"
            - name: BACKUP_IMAGE
              value: postgres:16-alpine     # клієнт pg_dump тієї ж мажорної версії, що й сервер
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
