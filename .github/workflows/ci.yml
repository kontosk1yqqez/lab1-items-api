# CI: збирання, unit-тести та Docker-образ для Items API
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build (compile sources)
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  docker-pack-n-push:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: ${{ vars.DOCKERHUB_REPOSITORY || 'kontorsk1yqqez/items-api' }}
      tag: latest
      context: .
      dockerfile: Dockerfile
      push: ${{ github.ref == 'refs/heads/main' }}
      artifact-name: items-api-image
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
