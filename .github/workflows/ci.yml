# CI: збирання, unit-тести та Docker-образ для Items API
name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build (compile sources)
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # Три образи розподіленого рішення збираються одним reusable workflow (matrix)
  docker-pack-n-push:
    needs: build-n-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: items-api          # backend (FastAPI)
            context: .
            dockerfile: Dockerfile
          - image: items-frontend     # SPA + nginx
            context: frontend
            dockerfile: Dockerfile
          - image: items-migrator     # консольний застосунок міграцій (Alembic)
            context: .
            dockerfile: migrator/Dockerfile
          - image: databasebackup-controller   # контролер DatabaseBackup (ЛР5)
            context: backup-controller
            dockerfile: Dockerfile
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: ${{ format('{0}/{1}', vars.DOCKERHUB_NAMESPACE || 'kontorsk1yqqez', matrix.image) }}
      tag: latest
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      push: ${{ github.ref == 'refs/heads/main' }}
      artifact-name: ${{ matrix.image }}-image
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Перевірка та пакування Helm Chart, архів зберігається в артефактах запуску
  helm-pack:
    needs: build-n-test
    runs-on: ubuntu-latest
    env:
      CHART_DIR: k8s/items-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.1

      - name: Chart metadata
        run: helm show chart "$CHART_DIR"

      - name: Lint chart
        run: |
          helm lint "$CHART_DIR" --strict
          helm lint "$CHART_DIR" -f k8s/values.lab.yaml --strict

      - name: Render manifests
        run: helm template lab "$CHART_DIR" -n webapp-lab -f k8s/values.lab.yaml > rendered.yaml

      - name: Package chart
        run: helm package "$CHART_DIR" --destination dist

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: |
            dist/*.tgz
            rendered.yaml
          retention-days: 14
