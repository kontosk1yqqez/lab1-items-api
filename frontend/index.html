<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items — каталог товарів</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <header>
    <h1>Каталог товарів</h1>
    <span id="status" class="status">завантаження…</span>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Новий товар</h2>
      <form id="item-form" autocomplete="off">
        <input type="hidden" id="item-id">
        <label>Назва
          <input id="name" required maxlength="200" placeholder="Ноутбук">
        </label>
        <label>Опис
          <input id="description" placeholder="16 ГБ RAM, SSD 512 ГБ">
        </label>
        <label>Ціна, грн
          <input id="price" type="number" min="0" step="0.01" required placeholder="25999">
        </label>
        <div class="actions">
          <button type="submit" id="submit-btn">Додати</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Скасувати</button>
        </div>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Список товарів</h2>
        <button type="button" id="refresh-btn" class="secondary">Оновити</button>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Назва</th><th>Опис</th><th class="num">Ціна</th><th></th></tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
      <p id="empty" class="muted" hidden>Товарів поки немає — додайте перший.</p>
    </section>
  </main>

  <footer class="muted">API: <code id="api-base"></code></footer>
  <script src="app.js"></script>
</body>
</html>
